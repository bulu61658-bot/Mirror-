<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Mirror</title>
<style>
:root{--bg:#EEF2F4;--card:#fff;--ink:#16242B;--mut:#5B6B73;--acc:#0E7C86;--onacc:#fff;--line:#C9D5DA;--err:#B3261E;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0F171B;--card:#172228;--ink:#E7EEF1;--mut:#93A4AC;--acc:#4FC3CC;--onacc:#06262A;--line:#2E3F47;--err:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
h2{font-size:18px;margin:26px 0 8px}
p{margin:0}
.mut{color:var(--mut);font-size:15px}
.screen{display:none;margin-top:18px}.screen.on{display:block}
.cam{position:relative;aspect-ratio:3/4;max-height:68vh;margin:0 auto;background:#000;border-radius:14px;overflow:hidden}
.mir{position:absolute;inset:0;transform:scaleX(-1)}
.mir video,.mir canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#msg{margin:12px 0;font-weight:600;min-height:1.5em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.pick{font:inherit;font-weight:600;border-radius:10px;padding:13px 8px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);text-align:center;cursor:pointer;position:relative}
.pri{background:var(--acc);color:var(--onacc)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.pick:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mut);font-size:15px}
.warn,.err{color:var(--err);font-weight:600;margin-bottom:12px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:zoom-in}
figure.big{grid-column:1/-1;cursor:zoom-out}
figure canvas{display:block;width:100%;height:auto;border-radius:6px}
figcaption{font-size:13px;color:var(--mut);margin:4px 0}
figure button{width:100%;padding:7px 4px;font-size:14px}
.blend{margin:16px 0 4px;display:block;font-weight:600}
.blend input{width:100%;accent-color:var(--acc)}
.blend span{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;font-weight:400}
#score{margin:14px 0 6px;font-size:18px;font-weight:600}
.mir.rear{transform:none}
.cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px}
.pr{display:grid;grid-template-columns:64px 1fr 34px;gap:10px;align-items:center;font-size:15px;margin:6px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.pr b{text-align:right}
#hist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#hist img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:pointer;display:block}
</style>
</head>
<body>
<main>
  <h1>Face Mirror</h1>
  <p class="mut">Look at the camera. Your face is straightened along its own middle line, then each half is joined with its mirror.</p>

  <section id="camScreen" class="screen on">
    <div class="cam"><div class="mir"><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div><div id="cnt" class="cnt"></div></div>
    <p id="msg">Loading face model…</p>
    <div class="row">
      <button id="snap" class="pri" disabled>Take photo</button>
      <div class="pick"><span>Choose from gallery</span><input id="gal" type="file" accept="image/*" aria-label="Choose from gallery"></div>
    </div>
    <button id="flip" style="width:100%;margin-top:10px">Flip camera</button>
    <label class="chk">Capture:&nbsp;<select id="mode"><option value="auto">Automatic (look straight)</option><option value="smile">Smile to capture</option><option value="manual">Tap button only</option></select></label>
    <label class="chk"><input type="checkbox" id="cd" checked> 3-2-1 countdown with beep</label>
    <div id="histBox" hidden>
      <h2>Recent</h2>
      <div id="hist"></div>
      <p class="mut" style="margin-top:8px">Tap a photo to save or share it.</p>
      <button id="clr" style="margin-top:10px">Clear history</button>
    </div>
  </section>

  <section id="resScreen" class="screen">
    <p id="warn" class="warn" hidden></p>
    <div class="strip" id="strip">
      <figure><canvas id="co"></canvas><figcaption>Original</figcaption><button data-s="co">Save</button></figure>
      <figure><canvas id="cl"></canvas><figcaption>Left + mirror</figcaption><button data-s="cl">Save</button></figure>
      <figure><canvas id="cr"></canvas><figcaption>Right + mirror</figcaption><button data-s="cr">Save</button></figure>
    </div>
    <p class="mut" style="margin-top:6px">Tap a photo to enlarge it. Left and right are as seen in the photo.</p>
    <label class="blend">Blend<input id="blend" type="range" min="0" max="100" value="100"><span><span>Original</span><span>Mirrored</span></span></label>
    <p id="score"></p>
    <div id="parts"></div>
    <button id="again" class="pri" style="width:100%">Take another</button>
  </section>
  <p class="err" id="err" role="alert" hidden></p>
</main>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = s => document.querySelector(s);
const MAX = 1600;
const PAIRS = [[33,263],[133,362],[70,300],[105,334],[61,291],[234,454],[58,288],[98,327]];
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const vid = $('#vid'), ov = $('#ov'), ox = ov.getContext('2d');
let lm, live = false, steady = 0, lastT = -1, comps = {}, counting = false, dark = false, fc = 0, facing = 'user', ac;

const msg = t => $('#msg').textContent = t;
const err = t => { const e = $('#err'); e.textContent = t || ''; e.hidden = !t; };
const screen = id => { $('#camScreen').classList.toggle('on', id === 'cam'); $('#resScreen').classList.toggle('on', id === 'res'); };

/* ---------- Setup ---------- */
async function init() {
  try {
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const make = d => FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true });
    try { lm = await make('GPU'); } catch (e) { lm = await make('CPU'); }
  } catch (e) { msg(''); err('Could not load the face model. Check your internet connection and reload.'); return; }
  $('#snap').disabled = false;
  renderHist();
  try {
    await startCam();
    startLive();
  } catch (e) { msg('Camera not available (' + (e.name || 'error') + '). You can still choose a photo from the gallery.'); }
}

/* ---------- Live camera guide ---------- */
async function startLive() {
  screen('cam'); err('');
  await lm.setOptions({ runningMode: 'VIDEO' });
  live = true; steady = 0; loop();
}

function loop() {
  if (!live) return;
  if (vid.readyState >= 2 && vid.currentTime !== lastT) {
    lastT = vid.currentTime;
    if (++fc % 15 === 1) dark = luma(vid) < 60;
    if (ov.width !== vid.videoWidth) { ov.width = vid.videoWidth; ov.height = vid.videoHeight; }
    const r = lm.detectForVideo(vid, performance.now());
    ox.clearRect(0, 0, ov.width, ov.height);
    const f = r.faceLandmarks[0];
    if (!f) { steady = 0; msg('Move your face into the frame.'); }
    else {
      const [A, B] = axis(f, ov.width, ov.height);
      drawLine(A, B);
      const fw = Math.abs(f[454].x - f[234].x), why = issue(r), mode = $('#mode').value;
      if (counting) { /* countdown running */ }
      else if (fw < 0.25) { steady = 0; msg('Come a little closer.'); }
      else if (dark) { steady = 0; msg('Too dark. Move near a light.'); }
      else if (why) { steady = 0; msg(why); }
      else if (mode === 'smile') { msg('Looking good. Now smile!'); if (smileOf(r) > 0.5) { snap(); return; } }
      else if (mode === 'auto') {
        if (!steady) steady = performance.now();
        msg('Hold still…');
        if (performance.now() - steady > 1200) { steady = 0; go(); }
      } else msg('Looking good. Tap Take photo.');
    }
  }
  requestAnimationFrame(loop);
}

function drawLine(A, B) {
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, T = ov.width + ov.height;
  ox.save(); ox.strokeStyle = '#4FC3CC'; ox.lineWidth = 3; ox.setLineDash([12, 8]);
  ox.beginPath(); ox.moveTo(A.x - dx / L * T, A.y - dy / L * T); ox.lineTo(A.x + dx / L * T, A.y + dy / L * T); ox.stroke(); ox.restore();
}

const axis = (f, w, h) => [{ x: f[10].x * w, y: f[10].y * h }, { x: f[152].x * w, y: f[152].y * h }];
const yawOf = f => (f[1].x - f[234].x) / ((f[454].x - f[234].x) || 1);

/* Returns a short instruction if the face is not looking straight into the camera, else '' */
function issue(r) {
  const f = r.faceLandmarks[0];
  if (Math.abs(yawOf(f) - 0.5) > 0.08) return 'Turn your face to look straight at the camera.';
  const m = r.facialTransformationMatrixes && r.facialTransformationMatrixes[0];
  if (m) {
    const d = m.data, n = Math.hypot(d[2], d[6], d[10]) || 1;
    if (Math.abs(d[6]) / n > 0.17) return 'Raise or lower your head so your face looks straight at the camera.';
    if (Math.abs(d[2]) / n > 0.2) return 'Turn your face to look straight at the camera.';
  }
  const bs = r.faceBlendshapes && r.faceBlendshapes[0];
  if (bs) {
    const g = {}; bs.categories.forEach(c => g[c.categoryName] = c.score);
    const av = (a, b) => ((g[a] || 0) + (g[b] || 0)) / 2;
    if (av('eyeBlinkLeft', 'eyeBlinkRight') > 0.35) return 'Open your eyes.';
    if (av('eyeLookDownLeft', 'eyeLookDownRight') > 0.28 || av('eyeLookUpLeft', 'eyeLookUpRight') > 0.4 ||
        av('eyeLookOutLeft', 'eyeLookInRight') > 0.4 || av('eyeLookInLeft', 'eyeLookOutRight') > 0.4)
      return 'Look into the camera lens, not at the screen.';
  }
  return '';
}

/* ---------- Capture / gallery ---------- */
async function startCam() {
  if (vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop());
  const open = v => navigator.mediaDevices.getUserMedia({ video: v, audio: false });
  let stream = null;
  for (const v of [{ facingMode: { exact: facing }, width: { ideal: 1280 } }, { facingMode: facing, width: { ideal: 1280 } }]) {
    try { stream = await open(v); } catch (e) { continue; }
    const got = stream.getVideoTracks()[0].getSettings().facingMode;
    if (!got || got === facing) break;
    stream.getTracks().forEach(t => t.stop()); stream = null;
  }
  if (!stream) {
    const want = facing === 'user' ? /front|user|selfie|facetime/i : /back|rear|environment/i;
    const cam = (await navigator.mediaDevices.enumerateDevices()).find(d => d.kind === 'videoinput' && want.test(d.label));
    if (!cam) throw new Error('No matching camera');
    stream = await open({ deviceId: { exact: cam.deviceId }, width: { ideal: 1280 } });
  }
  vid.srcObject = stream;
  $('.mir').classList.toggle('rear', facing !== 'user');
  await vid.play();
}
$('#flip').addEventListener('click', async () => {
  const prev = facing; facing = facing === 'user' ? 'environment' : 'user';
  try { await startCam(); steady = 0; } catch (e) { facing = prev; msg('This camera could not be opened (' + (e.name || 'error') + ').'); try { await startCam(); } catch (x) {} }
});

const smileOf = r => { const b = r.faceBlendshapes && r.faceBlendshapes[0]; if (!b) return 0; const g = {}; b.categories.forEach(c => g[c.categoryName] = c.score); return ((g.mouthSmileLeft || 0) + (g.mouthSmileRight || 0)) / 2; };

const lc = document.createElement('canvas'); lc.width = lc.height = 16;
const lx = lc.getContext('2d', { willReadFrequently: true });
function luma(src) {
  lx.drawImage(src, 0, 0, 16, 16);
  const d = lx.getImageData(0, 0, 16, 16).data; let t = 0;
  for (let i = 0; i < d.length; i += 4) t += .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2];
  return t / 256;
}
function sharp(src) {
  const w = 320, h = Math.round(src.height * 320 / src.width), c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = .299 * d[i * 4] + .587 * d[i * 4 + 1] + .114 * d[i * 4 + 2];
  let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w]; s += l; s2 += l * l; n++;
  }
  const m = s / n; return s2 / n - m * m;
}

function beep(f) {
  try {
    ac = ac || new AudioContext(); ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = 0.12;
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.12);
  } catch (e) {}
}
function go() {
  if (counting) return;
  if (!$('#cd').checked) { snap(); return; }
  counting = true; let n = 3;
  const tick = () => {
    if (!counting) return;
    if (n === 0) { snap(); return; }
    $('#cnt').textContent = n; beep(n === 1 ? 880 : 660); n--; setTimeout(tick, 1000);
  };
  tick();
}
function snap() {
  live = false; counting = false; $('#cnt').textContent = '';
  const vw = vid.videoWidth, vh = vid.videoHeight, k = Math.min(1, MAX / Math.max(vw, vh));
  const c = document.createElement('canvas'); c.width = Math.round(vw * k); c.height = Math.round(vh * k);
  const x = c.getContext('2d'); if (facing === 'user') { x.translate(c.width, 0); x.scale(-1, 1); } x.drawImage(vid, 0, 0, c.width, c.height);
  analyse(c);
}
$('#snap').addEventListener('click', () => { if (vid.srcObject) go(); else msg('Camera not available. Choose a photo from the gallery.'); });

$('#gal').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file || !lm) return;
  live = false; err('');
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (x) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }).catch(() => null); }
  if (!src) { err('This photo could not be opened. Try a different photo.'); if (vid.srcObject) startLive(); return; }
  const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight, k = Math.min(1, MAX / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  analyse(c);
});

/* ---------- Straighten, split, mirror ---------- */
async function analyse(base) {
  await lm.setOptions({ runningMode: 'IMAGE' });
  const r = lm.detect(base), f = r.faceLandmarks[0];
  if (!f) { err('No face found. Try a clear photo with your face looking at the camera.'); if (vid.srcObject) startLive(); else screen('cam'); return; }
  err('');
  const w = base.width, h = base.height, [a, b] = axis(f, w, h);
  const al = Math.atan2(b.x - a.x, b.y - a.y);

  const R = document.createElement('canvas'); R.width = w; R.height = h;
  const x = R.getContext('2d'), t = document.createElement('canvas'); t.width = t.height = 1;
  const tx = t.getContext('2d'); tx.drawImage(base, 0, 0, 1, 1);
  const d = tx.getImageData(0, 0, 1, 1).data;
  x.fillStyle = `rgb(${d[0]},${d[1]},${d[2]})`; x.fillRect(0, 0, w, h);
  x.translate(a.x, a.y); x.rotate(al); x.translate(-a.x, -a.y); x.drawImage(base, 0, 0);

  const ax = Math.round(a.x), hw = Math.floor(Math.min(ax, w - ax));
  const crop = document.createElement('canvas'); crop.width = hw * 2; crop.height = h;
  crop.getContext('2d').drawImage(R, ax - hw, 0, hw * 2, h, 0, 0, hw * 2, h);
  const side = s => {
    const c = document.createElement('canvas'); c.width = hw * 2; c.height = h;
    const y = c.getContext('2d'), sx = s === 'l' ? ax - hw : ax, ox_ = s === 'l' ? 0 : hw, mx = s === 'l' ? hw : 0;
    y.drawImage(R, sx, 0, hw, h, ox_, 0, hw, h);
    y.save(); y.translate(mx + hw, 0); y.scale(-1, 1); y.drawImage(R, sx, 0, hw, h, 0, 0, hw, h); y.restore();
    return c;
  };
  comps = { o: crop, l: side('l'), r: side('r') };

  for (const id of ['co', 'cl', 'cr']) { const c = $('#' + id); c.width = hw * 2; c.height = h; }
  $('#blend').value = 100; paint();
  $('#score').textContent = `Overall symmetry: ${symmetry(f, w, h, a, al)} / 100 (just for fun, not a medical measure)`;
  $('#parts').innerHTML = Object.entries(parts(f, w, h, a, al)).map(([k, v]) => `<div class="pr"><span>${k}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('');
  const probs = [issue(r), luma(base) < 60 ? 'The photo is too dark. Move near a light.' : '', sharp(base) < 45 ? 'The photo looks blurry. Hold the phone steady.' : ''].filter(Boolean);
  $('#warn').hidden = !probs.length;
  if (probs.length) $('#warn').textContent = probs.join(' ') + ' Retake for the best result.';
  document.querySelectorAll('#strip figure').forEach(fg => fg.classList.remove('big'));
  screen('res'); window.scrollTo({ top: 0, behavior: 'smooth' });
  addHist();
}

function paint() {
  const v = $('#blend').value / 100;
  $('#co').getContext('2d').drawImage(comps.o, 0, 0);
  for (const [id, k] of [['cl', 'l'], ['cr', 'r']]) {
    const x = $(' #' + id).getContext('2d');
    x.globalAlpha = 1; x.drawImage(comps.o, 0, 0);
    x.globalAlpha = v; x.drawImage(comps[k], 0, 0); x.globalAlpha = 1;
  }
}
$('#blend').addEventListener('input', paint);

function symmetry(f, w, h, a, al) {
  const c = Math.cos(al), s = Math.sin(al);
  const T = i => { const x = f[i].x * w - a.x, y = f[i].y * h - a.y; return { x: x * c - y * s, y: x * s + y * c }; };
  let hs = 0, vs = 0;
  PAIRS.forEach(([l, r]) => {
    const p = T(l), q = T(r), pa = Math.abs(p.x), qa = Math.abs(q.x);
    hs += Math.abs(pa - qa) / ((pa + qa) || 1); vs += Math.abs(p.y - q.y);
  });
  const fw = Math.abs(T(234).x - T(454).x) || 1, n = PAIRS.length;
  return Math.max(0, Math.round(100 - 250 * (hs / n) - 250 * (vs / n / fw)));
}

const GROUPS = { Eyes: [[33,263],[133,362]], Brows: [[70,300],[105,334]], Mouth: [[61,291]], Jaw: [[58,288],[234,454]] };
function parts(f, w, h, a, al) {
  const c = Math.cos(al), s = Math.sin(al);
  const T = i => { const x = f[i].x * w - a.x, y = f[i].y * h - a.y; return { x: x * c - y * s, y: x * s + y * c }; };
  const fw = Math.abs(T(234).x - T(454).x) || 1, out = {};
  for (const k in GROUPS) {
    let hs = 0, vs = 0;
    GROUPS[k].forEach(([l, r]) => { const p = T(l), q = T(r), pa = Math.abs(p.x), qa = Math.abs(q.x); hs += Math.abs(pa - qa) / ((pa + qa) || 1); vs += Math.abs(p.y - q.y); });
    const n = GROUPS[k].length;
    out[k] = Math.max(0, Math.round(100 - 250 * (hs / n) - 250 * (vs / n / fw)));
  }
  return out;
}

/* ---------- Save / share, enlarge ---------- */
async function share(blob, name) {
  const file = new File([blob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
$('#strip').addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (btn) {
    const c = $('#' + btn.dataset.s);
    c.toBlob(b => share(b, 'face-mirror-' + btn.dataset.s + '.jpg'), 'image/jpeg', 0.92);
  } else { const fg = e.target.closest('figure'); if (fg) fg.classList.toggle('big'); }
});
$('#again').addEventListener('click', () => { if (vid.srcObject) startLive(); else screen('cam'); });

/* ---------- History ---------- */
const HK = 'fm_hist';
const loadHist = () => { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch (e) { return []; } };
function thumb(c) {
  const k = Math.min(1, 480 / c.width), t = document.createElement('canvas');
  t.width = Math.round(c.width * k); t.height = Math.round(c.height * k);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  return t.toDataURL('image/jpeg', 0.7);
}
function addHist() {
  try {
    const list = loadHist(); list.unshift({ l: thumb(comps.l), r: thumb(comps.r) });
    localStorage.setItem(HK, JSON.stringify(list.slice(0, 6)));
  } catch (e) {}
  renderHist();
}
function renderHist() {
  const list = loadHist(), box = $('#hist');
  $('#histBox').hidden = !list.length;
  box.innerHTML = '';
  list.forEach((it, i) => ['l', 'r'].forEach(k => {
    const im = new Image(); im.src = it[k]; im.alt = (k === 'l' ? 'Left' : 'Right') + ' mirror photo ' + (i + 1);
    im.addEventListener('click', async () => share(await (await fetch(it[k])).blob(), 'face-mirror-' + k + '.jpg'));
    box.appendChild(im);
  }));
}
$('#clr').addEventListener('click', () => { try { localStorage.removeItem(HK); } catch (e) {} renderHist(); });

init();
</script>
</body>
</html>
